[project]
name = "esbridge"
version = "0.1.0"
description = "A minimal BFO/PMDco integration profile for electronic-structure calculations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7,<8",
    "pyshacl>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
